<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Test Firebase Auth</title>
  <style>
    body { 
      background: #000; 
      color: #fff; 
      font-family: Arial; 
      padding: 20px; 
    }
    .status { 
      padding: 15px; 
      margin: 10px 0; 
      border-radius: 8px; 
    }
    .success { background: #1a4d1a; border: 1px solid #22c55e; }
    .error { background: #4d1a1a; border: 1px solid #dc2626; }
    .info { background: #1a1a4d; border: 1px solid #3b82f6; }
    button {
      background: #8b0000;
      color: #fff;
      border: none;
      padding: 12px 24px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 16px;
      margin: 5px;
    }
    button:hover { background: #a00000; }
  </style>
</head>
<body>
  <h1>🧟 Test de Autenticación Firebase</h1>
  <div id="status" class="status info">⏳ Verificando estado de autenticación...</div>
  
  <div id="userInfo" style="display:none;">
    <h2>✅ Usuario conectado:</h2>
    <p><strong>Email:</strong> <span id="userEmail"></span></p>
    <p><strong>Nombre:</strong> <span id="userName"></span></p>
    <p><strong>UID:</strong> <span id="userUid"></span></p>
    <button onclick="logoutTest()">🚪 Cerrar sesión</button>
    <button onclick="window.location.href='index.html'">🏠 Ir a index.html</button>
  </div>
  
  <div id="loginForm" style="display:none;">
    <h2>❌ No hay usuario conectado</h2>
    <input type="email" id="testEmail" placeholder="Email" style="padding:10px; margin:5px; width:250px;">
    <input type="password" id="testPassword" placeholder="Contraseña" style="padding:10px; margin:5px; width:250px;">
    <br>
    <button onclick="loginTest()">🔐 Iniciar sesión de prueba</button>
    <button onclick="window.location.href='login.html'">← Volver al login</button>
  </div>

  <script type="module">
    import { auth } from './firebase-config.js';
    import { 
      onAuthStateChanged, 
      signInWithEmailAndPassword,
      signOut 
    } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

    const statusEl = document.getElementById('status');
    const userInfoEl = document.getElementById('userInfo');
    const loginFormEl = document.getElementById('loginForm');

    onAuthStateChanged(auth, (user) => {
      if (user) {
        statusEl.className = 'status success';
        statusEl.textContent = '✅ Usuario autenticado correctamente';
        userInfoEl.style.display = 'block';
        loginFormEl.style.display = 'none';
        document.getElementById('userEmail').textContent = user.email;
        document.getElementById('userName').textContent = user.displayName || 'Sin nombre';
        document.getElementById('userUid').textContent = user.uid;
      } else {
        statusEl.className = 'status error';
        statusEl.textContent = '❌ No hay usuario autenticado';
        userInfoEl.style.display = 'none';
        loginFormEl.style.display = 'block';
      }
    });

    window.loginTest = async () => {
      const email = document.getElementById('testEmail').value;
      const password = document.getElementById('testPassword').value;
      
      try {
        statusEl.className = 'status info';
        statusEl.textContent = '🔄 Intentando iniciar sesión...';
        
        await signInWithEmailAndPassword(auth, email, password);
        statusEl.className = 'status success';
        statusEl.textContent = '✅ Login exitoso';
      } catch (error) {
        statusEl.className = 'status error';
        statusEl.textContent = `❌ Error: ${error.message}`;
        console.error(error);
      }
    };

    window.logoutTest = async () => {
      try {
        await signOut(auth);
        statusEl.className = 'status info';
        statusEl.textContent = '👋 Sesión cerrada';
      } catch (error) {
        console.error(error);
      }
    };
  </script>
</body>
</html>
